description: 'Osmo (Tangible Play) makes hands-on, screen-interactive learning games
  for iPad and Fire tablet that pair a physical reflector base placed over the device
  camera with digital games spanning math, coding, spelling, drawing, and problem-solving
  for children. Backed by Accel and GV, Osmo is a consumer educational-technology
  brand that sells hardware kits and companion apps direct to families and schools.
  As of this enrichment pass it does not publish a public developer API, SDK, or developer
  portal; this profile captures its public web identity and domain-security posture.'
